name: Build, Push & Deploy to Cloud Run (Production)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  BACKEND_IMAGE: agri-interview-backend-prod
  FRONTEND_IMAGE: agri-interview-frontend-prod
  GCP_REGION: asia-south1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BACKEND_SERVICE: agri-interview-backend-prod
  FRONTEND_SERVICE: agri-interview-frontend-prod

jobs:
  build_backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build_frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL_PROD }}
            AUTH_TRUST_HOST=true
            BACKEND_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}

  deploy_backend:
    name: Deploy Backend to Cloud Run
    needs: build_backend
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_GH_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          env_vars: |
            MONGO_URI=${{ secrets.MONGO_URI_PROD }}
            MONGO_DB_NAME=${{ vars.MONGO_DB_NAME_PROD }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS_PROD }}
            LLM_BASE_URL=${{ vars.LLM_BASE_URL }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_MODEL=${{ vars.LLM_MODEL }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL_PROD }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_PROD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
            INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN_PROD }}
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
            STORAGE_BACKEND=${{ vars.STORAGE_BACKEND }}
            EMAIL_SMTP_HOST=${{ vars.EMAILHOST }}
            EMAIL_SMTP_PORT=${{ vars.EMAILPORT }}
            EMAIL_SMTP_USER=${{ secrets.EMAIL_SMTP_USER }}
            EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}
            EMAIL_FROM_ADDRESS=${{ vars.EMAILFROMADDRESS }}
            EMAIL_FROM_NAME=${{ vars.EMAILFROMNAME }}
            GCS_BASE_PREFIX=${{ vars.GCS_BASE_PREFIX_PROD }}

  deploy_frontend:
    name: Deploy Frontend to Cloud Run
    needs: build_frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_GH_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          env_vars: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL_PROD }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET_PROD }}
            AUTH_TRUST_HOST=true
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN_PROD }}
            BACKEND_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}

      - name: Generate production Firebase config
        run: |
          mkdir -p deploy/prod/public
          cat > deploy/prod/firebase.json <<'JSON'
          {
            "hosting": {
              "site": "agri-interview-platform-prod",
              "public": "public",
              "rewrites": [
                {
                  "source": "**",
                  "run": {
                    "serviceId": "agri-interview-frontend-prod",
                    "region": "asia-south1"
                  }
                }
              ]
            }
          }
          JSON
          cat > deploy/prod/.firebaserc <<'JSON'
          {
            "projects": {
              "default": "${{ secrets.FIREBASE_PROJECT_ID }}"
            }
          }
          JSON

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_GH_SA_KEY }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: ./deploy/prod